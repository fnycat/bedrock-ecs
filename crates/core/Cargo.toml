[package]
name = "tecs"
version = "0.1.0"
edition = "2024"

[package.metadata.verus]
verify = true

[lints.rust]
# Verus supports ghost code, code that is used for proofs but erased during compilation.
# This means that ghost items that are imported via `use` will not exist during a normal
# `cargo build`, leading to compilation errors. These errors can be prevented by guarding the
# use statements with the feature flag `verus_only`, which Verus turns on during
# verification.
#
# WARNING: this flag should only be used on import statements and setting config attributes,
# see the documentation (https://verus-lang.github.io/verus/guide/erasure.html) for more details.
#
# This lint suppression prevents cargo from complaining about the
# `verus_only` feature flag being undeclared.
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(verus_only)',
] }

[features]
tracing = []
generics = []
inspect = []
plugins = ["dep:wasmtime", "dep:wit-bindgen", "dep:wasmtime-wasi"]
default = ["generics", "tracing", "inspect"]

[[bench]]
name = "signature"
harness = false

[[bench]]
name = "iter"
harness = false

[dependencies]
tecs_derive = { path = "../derive" }
smallvec = "1.13.2"
paste = "1.0.15"
rayon = "1.11.0"
generic-array = "1.3.5"
tracing = { version = "0.1.44", features = ["release_max_level_off"]}
rustc-hash = "2.1.1"
thread_local = "1.1.9"
nonmax = "0.5.5"
open = "5.3.3"

wasmtime = { version = "50.0.1", optional = true, default-features = false, features = ["runtime", "cranelift", "parallel-compilation", "demangle", "component-model"] }
wit-bindgen = { version = "0.63.0", optional = true }
wasmtime-wasi = { version = "50.0.1", optional = true }
bytes = "1.11.1"
nohash-hasher = "0.2.0"

vstd = "=0.0.0-2026-11-01-0251"

[dev-dependencies]
bevy_ecs = "0.18.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10.0"
tracing-subscriber = "0.3.23"
